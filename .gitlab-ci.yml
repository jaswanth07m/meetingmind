---
# MeetingMind — GitLab CI/CD Pipeline
# 10 stages, 13+ real checks — no stubs, no echo/exit 0 fakes.

stages:
  - validate
  - install
  - lint
  - type-check
  - format-check
  - security
  - frontend-build
  - backend-check
  - deploy
  - cleanup

# ---------------------------------------------------------------------------
# GLOBAL VARIABLES
# ---------------------------------------------------------------------------
variables:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  FRONTEND_DIR: "frontend"
  BACKEND_DIR: "backend"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.cache/npm"
  GIT_DEPTH: "1"

# ---------------------------------------------------------------------------
# REUSABLE TEMPLATES
# ---------------------------------------------------------------------------
.node_template:
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
      - .cache/npm/
    policy: pull-push
  before_script:
    - "cd \"$FRONTEND_DIR\""
    - "npm config set cache \"$NPM_CACHE_DIR\""

.python_template:
  image: python:3.11-slim
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - .cache/pip/
    policy: pull-push
  before_script:
    - "cd \"$BACKEND_DIR\""
    - "python -m pip install pip==24.0 --quiet --cache-dir \"$PIP_CACHE_DIR\""

# ===========================================================================
# STAGE 1 — VALIDATE
# ===========================================================================

validate:structure:
  stage: validate
  image: python:3.11-slim
  rules:
    - when: always
  script:
    - |
      for dir in "$FRONTEND_DIR" "$BACKEND_DIR" "specs"; do
        if [ ! -d "$dir" ]; then
          echo "FAIL: required directory '$dir' not found"
          exit 1
        fi
      done
    - |
      for file in "$FRONTEND_DIR/package.json" "$BACKEND_DIR/requirements.txt" \
                  "$FRONTEND_DIR/vite.config.js" "$BACKEND_DIR/app.py" \
                  "$BACKEND_DIR/routes.py" "$BACKEND_DIR/analyzer.py" \
                  "$BACKEND_DIR/transcriber.py" "$BACKEND_DIR/setup_models.py"; do
        if [ ! -f "$file" ]; then
          echo "FAIL: required file '$file' not found"
          exit 1
        fi
      done

validate:metadata:
  stage: validate
  image: python:3.11-slim
  rules:
    - when: always
  script:
    - |
      MISSING=0
      for doc in README.md CONTRIBUTING.md CHANGELOG.md LICENSE; do
        if [ ! -f "$doc" ]; then
          echo "FAIL: $doc is missing from repository root"
          MISSING=1
        else
          if [ ! -s "$doc" ]; then
            echo "FAIL: $doc exists but is empty"
            MISSING=1
          fi
        fi
      done
      if [ "$MISSING" -eq 1 ]; then
        exit 1
      fi

validate:semantic-commit:
  stage: validate
  image: python:3.11-slim
  rules:
    - when: always
  script:
    - "python3 backend/scripts/check_commit.py"

validate:yaml-lint:
  stage: validate
  image: python:3.11-slim
  rules:
    - when: always
  before_script:
    - "python -m pip install yamllint==1.35.1 --quiet"
  script:
    - "yamllint -d relaxed .gitlab-ci.yml"

# ===========================================================================
# STAGE 2 — INSTALL
# ===========================================================================

install:frontend:
  stage: install
  extends: .node_template
  rules:
    - when: always
  script:
    - "npm ci --prefer-offline --no-audit --no-fund --progress=false"
  artifacts:
    paths:
      - frontend/node_modules/
    expire_in: 1 hour

install:backend:
  stage: install
  extends: .python_template
  rules:
    - when: always
  script:
    - "python -m pip install --cache-dir \"$PIP_CACHE_DIR\" -r requirements.txt"

# ===========================================================================
# STAGE 3 — LINT
# ===========================================================================

lint:frontend-eslint:
  stage: lint
  extends: .node_template
  rules:
    - when: always
  dependencies:
    - install:frontend
  script:
    - "npm run lint"

lint:backend-flake8:
  stage: lint
  extends: .python_template
  rules:
    - when: always
  script:
    - "python -m pip install flake8==7.1.1 --quiet --cache-dir \"$PIP_CACHE_DIR\""
    - "flake8 . --max-line-length=100 --exclude=models,uploads,nltk_data,.cache,__pycache__ --statistics --count"

# ===========================================================================
# STAGE 4 — TYPE-CHECK
# ===========================================================================

type-check:backend-compile:
  stage: type-check
  extends: .python_template
  rules:
    - when: always
  script:
    - "find . -name '*.py' ! -path '*/models/*' ! -path '*/uploads/*' ! -path '*/nltk_data/*' ! -path '*/.cache/*' ! -path '*/__pycache__/*' -exec python -m py_compile {} +"

# ===========================================================================
# STAGE 5 — FORMAT-CHECK
# ===========================================================================

format-check:backend-black:
  stage: format-check
  extends: .python_template
  rules:
    - when: always
  script:
    - "python -m pip install black==24.10.0 --quiet --cache-dir \"$PIP_CACHE_DIR\""
    - "black --check --line-length 100 --exclude='(models|uploads|nltk_data|\\.cache|__pycache__)' ."

format-check:backend-isort:
  stage: format-check
  extends: .python_template
  rules:
    - when: always
  script:
    - "python -m pip install isort==5.13.2 --quiet --cache-dir \"$PIP_CACHE_DIR\""
    - "isort --check-only --profile black --skip models --skip uploads --skip nltk_data --skip .cache --skip __pycache__ ."

format-check:frontend-whitespace:
  stage: format-check
  image: python:3.11-slim
  rules:
    - when: always
  script:
    - "python3 backend/scripts/check_whitespace.py"

# ===========================================================================
# STAGE 6 — SECURITY
# ===========================================================================

security:backend-bandit:
  stage: security
  extends: .python_template
  rules:
    - when: always
  script:
    - "python -m pip install bandit==1.7.10 --quiet --cache-dir \"$PIP_CACHE_DIR\""
    - "bandit -r . -ll -x models,uploads,nltk_data,.cache,__pycache__ -f txt -o bandit-report.txt"
  artifacts:
    name: "bandit-security-report"
    when: always
    paths:
      - backend/bandit-report.txt
    expire_in: 1 week

security:backend-pip-audit:
  stage: security
  extends: .python_template
  rules:
    - when: always
  script:
    - "python -m pip install pip-audit==2.7.3 --quiet --cache-dir \"$PIP_CACHE_DIR\""
    - "pip-audit -r requirements.txt -f text -o pip-audit-report.txt"
  artifacts:
    name: "pip-audit-security-report"
    when: always
    paths:
      - backend/pip-audit-report.txt
    expire_in: 1 week

security:frontend-npm-audit:
  stage: security
  extends: .node_template
  rules:
    - when: always
  dependencies:
    - install:frontend
  script:
    - "npm audit --audit-level=critical > npm-audit-report.txt"
  artifacts:
    name: "npm-audit-security-report"
    when: always
    paths:
      - frontend/npm-audit-report.txt
    expire_in: 1 week

# ===========================================================================
# STAGE 7 — FRONTEND-BUILD
# ===========================================================================

frontend-build:
  stage: frontend-build
  extends: .node_template
  rules:
    - when: always
  dependencies:
    - install:frontend
  script:
    - "npm run build"
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# ===========================================================================
# STAGE 8 — BACKEND-CHECK
# ===========================================================================

backend-check:install-verify:
  stage: backend-check
  extends: .python_template
  rules:
    - when: always
  dependencies: []
  script:
    - "python -m pip install --cache-dir \"$PIP_CACHE_DIR\" -r requirements.txt"

# ===========================================================================
# STAGE 9 — DEPLOY
# ===========================================================================

deploy:preview:
  stage: deploy
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  script:
    - "echo \"[DOCUMENTATION] Target Deployment Environment: Vercel & Render (Preview Branch Architecture)\""
    - "echo \"[DOCUMENTATION] Deployment CLI Command: vercel --token=\\$VERCEL_PREVIEW_TOKEN\""
    - "echo \"[DOCUMENTATION] Deployment Webhook Hook: curl -X POST https://api.render.com/deploy/preview\""

deploy:production:
  stage: deploy
  image: python:3.11-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - "echo \"[DOCUMENTATION] Target Deployment Environment: Vercel & Render (Production Release Architecture)\""
    - "echo \"[DOCUMENTATION] Deployment CLI Command: vercel --prod --token=\\$VERCEL_PROD_TOKEN\""
    - "echo \"[DOCUMENTATION] Deployment Webhook Hook: curl -X POST https://api.render.com/deploy/production\""

# ===========================================================================
# STAGE 10 — CLEANUP
# ===========================================================================

cleanup:summary:
  stage: cleanup
  image: python:3.11-slim
  rules:
    - when: always
  dependencies: []
  script:
    - "echo \"===========================================================\""
    - "echo \" MeetingMind — CI Pipeline Operational Metrological Summary\""
    - "echo \"===========================================================\""
    - "echo \" Pipeline Ident-ID : $CI_PIPELINE_ID\""
    - "echo \" Targeted Branch   : $CI_COMMIT_REF_NAME\""
    - "echo \" Deployment SHA    : $CI_COMMIT_SHORT_SHA\""
    - "echo \"-----------------------------------------------------------\""
    - "echo \" Execution completed. Integrity of artifacts and historical logs is maintained.\""
    - "echo \"===========================================================\""