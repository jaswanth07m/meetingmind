<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Outer gradient definition -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Microphone body -->
  <rect x="24" y="10" width="16" height="24" rx="8" fill="url(#g)"/>

  <!-- Microphone stand arc -->
  <path d="M18 32 C18 43 46 43 46 32" stroke="url(#g)" stroke-width="3.5"
        stroke-linecap="round" fill="none"/>

  <!-- Vertical stem -->
  <line x1="32" y1="43" x2="32" y2="52" stroke="url(#g)" stroke-width="3.5"
        stroke-linecap="round"/>

  <!-- Base bar -->
  <line x1="24" y1="52" x2="40" y2="52" stroke="url(#g)" stroke-width="3.5"
        stroke-linecap="round"/>
</svg>
